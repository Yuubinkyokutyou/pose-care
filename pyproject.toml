[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pose-care"
version = "0.2.0"
description = "Windows posture monitor powered by MediaPipe Pose Landmarker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mediapipe>=0.10.31,<1.1",
  "numpy>=1.26,<3",
  "PySide6>=6.8,<7",
  "winrt-runtime>=3.2,<4; platform_system == 'Windows'",
  "winrt-Windows.Foundation>=3.2,<4; platform_system == 'Windows'",
  "winrt-Windows.Foundation.Collections>=3.2,<4; platform_system == 'Windows'",
  "winrt-Windows.Graphics.Imaging>=3.2,<4; platform_system == 'Windows'",
  "winrt-Windows.Media.Capture>=3.2,<4; platform_system == 'Windows'",
  "winrt-Windows.Media.Capture.Frames>=3.2,<4; platform_system == 'Windows'",
  "winrt-Windows.Storage.Streams>=3.2,<4; platform_system == 'Windows'",
  "windows-toasts>=1.3.1,<2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.11,<7",
  "pytest>=8.3,<9",
]

[project.gui-scripts]
pose-care = "pose_care.app:main"

[tool.setuptools.packages.find]
include = ["pose_care*"]

[tool.setuptools.package-data]
pose_care = ["ui/qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
