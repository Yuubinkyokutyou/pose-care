name: Build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Each job opts in to only the repository access it needs.
permissions: {}

# Keep releases ordered when multiple commits reach main in quick succession.
concurrency:
  group: pose-care-main-release
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Test and build Windows app
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      sha256: ${{ steps.package.outputs.sha256 }}
      setup_sha256: ${{ steps.package.outputs.setup_sha256 }}

    steps:
      - name: Check out main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual run always publishes main, even if another ref was selected in the UI.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Run tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest

      - name: Create embedded release metadata
        id: release
        shell: pwsh
        run: |
          $version = (& .\.venv\Scripts\python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) {
              throw "Could not read the project version from pyproject.toml."
          }
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw "Project version must use strict x.y.z format; got '$version'."
          }

          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $commit) {
              throw "Could not determine the checked-out commit."
          }

          if ($env:GITHUB_RUN_ID -notmatch '^\d+$' -or $env:GITHUB_RUN_ATTEMPT -notmatch '^\d+$') {
              throw "GitHub run identifiers are missing or invalid."
          }

          # run_id stays globally unique if this workflow is renamed or recreated, while
          # run_attempt makes an explicit re-run unique.
          $tag = "v$version-build.$env:GITHUB_RUN_ID.$env:GITHUB_RUN_ATTEMPT"
          $metadata = [ordered]@{
              schema_version = 1
              version = $version
              tag = $tag
              commit = $commit
              asset = "PoseCare-update-windows-x64.zip"
              built_at = [DateTime]::UtcNow.ToString("o")
          }
          $metadata | ConvertTo-Json | Set-Content -LiteralPath "pose_care\release.json" -Encoding utf8NoBOM

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "commit=$commit"

      - name: Build Windows application
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Package release assets
        id: package
        shell: pwsh
        run: |
          $distDirectory = Join-Path (Get-Location).Path "dist\PoseCare"
          $executable = Join-Path $distDirectory "PoseCare.exe"
          $installManifest = Join-Path $distDirectory "PoseCare.install.json"
          $embeddedMetadata = Join-Path $distDirectory "_internal\pose_care\release.json"
          $builtInstaller = Join-Path (Get-Location).Path "dist\installer\PoseCareSetup-windows-x64.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "Expected executable was not built: $executable"
          }
          if (-not (Test-Path -LiteralPath $installManifest -PathType Leaf)) {
              throw "Install manifest was not built: $installManifest"
          }
          if (-not (Test-Path -LiteralPath $embeddedMetadata -PathType Leaf)) {
              throw "Release metadata was not embedded: $embeddedMetadata"
          }
          if (-not (Test-Path -LiteralPath $builtInstaller -PathType Leaf)) {
              throw "Expected setup executable was not built: $builtInstaller"
          }

          $installManifestPayload = Get-Content -LiteralPath $installManifest -Raw | ConvertFrom-Json
          if ($installManifestPayload.schema_version -ne 1 -or $installManifestPayload.product -ne "PoseCare.Desktop") {
              throw "Install manifest has an unexpected schema or product."
          }
          $manifestFiles = @($installManifestPayload.files)
          if ($manifestFiles.Count -eq 0) {
              throw "Install manifest has no file records."
          }

          $manifestPaths = [System.Collections.Generic.HashSet[string]]::new(
              [System.StringComparer]::OrdinalIgnoreCase
          )
          $installDirectoryPrefix = [System.IO.Path]::GetFullPath($distDirectory).TrimEnd('\') + '\'
          $previousPath = $null
          foreach ($fileRecord in $manifestFiles) {
              $relativePath = [string]$fileRecord.path
              $expectedHash = [string]$fileRecord.sha256
              $invalidSegment = @($relativePath -split '/' | Where-Object { -not $_ -or $_ -eq '.' -or $_ -eq '..' })
              if (-not $relativePath -or
                  $relativePath.Contains('\') -or
                  $relativePath.Contains(':') -or
                  $relativePath.StartsWith('/') -or
                  $invalidSegment.Count -gt 0) {
                  throw "Install manifest contains an unsafe path: $relativePath"
              }
              if ($relativePath.Equals("PoseCare.install.json", [System.StringComparison]::OrdinalIgnoreCase)) {
                  throw "Install manifest must not contain its own unverifiable hash."
              }
              if ($expectedHash -notmatch '^[0-9a-f]{64}$') {
                  throw "Install manifest contains an invalid SHA-256 for $relativePath."
              }
              if (-not $manifestPaths.Add($relativePath)) {
                  throw "Install manifest contains a case-insensitive duplicate path: $relativePath"
              }
              if ($null -ne $previousPath -and
                  [System.StringComparer]::Ordinal.Compare($previousPath, $relativePath) -ge 0) {
                  throw "Install manifest file records are not sorted by ordinal path."
              }
              $previousPath = $relativePath

              $fullPath = [System.IO.Path]::GetFullPath(
                  (Join-Path $distDirectory $relativePath.Replace('/', '\'))
              )
              if (-not $fullPath.StartsWith($installDirectoryPrefix, [System.StringComparison]::OrdinalIgnoreCase) -or
                  -not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
                  throw "Install manifest references a missing or escaped file: $relativePath"
              }
              $actualHash = (Get-FileHash -LiteralPath $fullPath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualHash -cne $expectedHash) {
                  throw "Install manifest hash mismatch: $relativePath"
              }
          }

          $actualManagedFiles = @(
              Get-ChildItem -LiteralPath $distDirectory -Recurse -File -Force | ForEach-Object {
                  $fullPath = [System.IO.Path]::GetFullPath($_.FullName)
                  $relativePath = $fullPath.Substring($installDirectoryPrefix.Length).Replace('\', '/')
                  if (-not $relativePath.Equals("PoseCare.install.json", [System.StringComparison]::OrdinalIgnoreCase)) {
                      $relativePath
                  }
              }
          )
          if ($actualManagedFiles.Count -ne $manifestPaths.Count) {
              throw "Install manifest file count does not match the build output."
          }
          foreach ($relativePath in $actualManagedFiles) {
              if (-not $manifestPaths.Contains($relativePath)) {
                  throw "Build output is missing from the install manifest: $relativePath"
              }
          }
          if (-not $manifestPaths.Contains("PoseCare.exe")) {
              throw "Install manifest does not own PoseCare.exe."
          }

          New-Item -ItemType Directory -Path "release" -Force | Out-Null
          $archive = "release\PoseCare-update-windows-x64.zip"
          # Preserve the PoseCare directory as the only top-level install root.
          Compress-Archive -Path $distDirectory -DestinationPath $archive -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $archive))
          try {
              $archiveEntries = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
          }
          finally {
              $zip.Dispose()
          }
          if ($archiveEntries -notcontains "PoseCare/PoseCare.exe") {
              throw "Release archive does not contain PoseCare/PoseCare.exe."
          }
          if ($archiveEntries -notcontains "PoseCare/PoseCare.install.json") {
              throw "Release archive does not contain the install manifest."
          }
          if ($archiveEntries -notcontains "PoseCare/_internal/pose_care/release.json") {
              throw "Release archive does not contain embedded release metadata."
          }
          $archiveFileEntries = [System.Collections.Generic.HashSet[string]]::new(
              [System.StringComparer]::OrdinalIgnoreCase
          )
          foreach ($entryName in $archiveEntries) {
              if (-not $entryName.EndsWith('/')) {
                  if (-not $archiveFileEntries.Add($entryName)) {
                      throw "Release archive contains a case-insensitive duplicate entry: $entryName"
                  }
              }
          }
          if ($archiveFileEntries.Count -ne ($manifestPaths.Count + 1)) {
              throw "Release archive file count does not match the install manifest plus marker."
          }
          foreach ($relativePath in $manifestPaths) {
              if (-not $archiveFileEntries.Contains("PoseCare/$relativePath")) {
                  throw "Release archive is missing a manifest-owned file: $relativePath"
              }
          }
          $unexpectedEntries = @($archiveEntries | Where-Object {
              $_ -ne "PoseCare/" -and -not $_.StartsWith("PoseCare/", [System.StringComparison]::Ordinal)
          })
          if ($unexpectedEntries.Count -gt 0) {
              throw "Release archive contains entries outside the PoseCare wrapper: $($unexpectedEntries -join ', ')"
          }

          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PoseCare-update-windows-x64.zip" | Set-Content -LiteralPath "release\PoseCare-update-windows-x64.zip.sha256" -Encoding ascii
          $setup = "release\PoseCareSetup-windows-x64.exe"
          Copy-Item -LiteralPath $builtInstaller -Destination $setup
          $setupHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  PoseCareSetup-windows-x64.exe" | Set-Content -LiteralPath "release\PoseCareSetup-windows-x64.exe.sha256" -Encoding ascii
          Copy-Item -LiteralPath "pose_care\release.json" -Destination "release\release.json"

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sha256=$hash"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "setup_sha256=$setupHash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PoseCare-${{ steps.release.outputs.tag }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write

    # This job deliberately receives only the built artifact. It never checks out the
    # repository, installs dependencies, or executes the packaged application.
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PoseCare-${{ needs.build.outputs.tag }}
          path: release

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_SHA256: ${{ needs.build.outputs.sha256 }}
          RELEASE_SETUP_SHA256: ${{ needs.build.outputs.setup_sha256 }}
        run: |
          Set-StrictMode -Version Latest
          $archive = "release\PoseCare-update-windows-x64.zip"
          $checksum = "release\PoseCare-update-windows-x64.zip.sha256"
          $setup = "release\PoseCareSetup-windows-x64.exe"
          $setupChecksum = "release\PoseCareSetup-windows-x64.exe.sha256"
          $metadataPath = "release\release.json"
          foreach ($requiredPath in @($archive, $checksum, $setup, $setupChecksum, $metadataPath)) {
              if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
                  throw "Downloaded release artifact is incomplete: $requiredPath"
              }
          }
          $downloadedFiles = @(Get-ChildItem -LiteralPath "release" -File -Force)
          if ($downloadedFiles.Count -ne 5) {
              throw "Downloaded release artifact contains unexpected files."
          }

          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -cne $env:RELEASE_SHA256) {
              throw "Downloaded release archive does not match the build job SHA-256."
          }
          $checksumLine = (Get-Content -LiteralPath $checksum -Raw).Trim()
          if ($checksumLine -cne "$archiveHash  PoseCare-update-windows-x64.zip") {
              throw "Downloaded checksum file is inconsistent."
          }
          $setupHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($setupHash -cne $env:RELEASE_SETUP_SHA256) {
              throw "Downloaded setup executable does not match the build job SHA-256."
          }
          $setupChecksumLine = (Get-Content -LiteralPath $setupChecksum -Raw).Trim()
          if ($setupChecksumLine -cne "$setupHash  PoseCareSetup-windows-x64.exe") {
              throw "Downloaded setup checksum file is inconsistent."
          }
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          if ($metadata.version -cne $env:RELEASE_VERSION -or
              $metadata.tag -cne $env:RELEASE_TAG -or
              $metadata.commit -cne $env:RELEASE_COMMIT) {
              throw "Downloaded release metadata is inconsistent with the build outputs."
          }

          @"
          Automated Windows build from the main branch.

          - Version: $env:RELEASE_VERSION
          - Commit: $env:RELEASE_COMMIT
          - Setup SHA-256: ``$env:RELEASE_SETUP_SHA256``

          Download and run ``PoseCareSetup-windows-x64.exe``. It installs PoseCare for the
          current user in ``%LOCALAPPDATA%\Programs\PoseCare`` and creates shortcuts.

          ``PoseCare-update-windows-x64.zip`` is reserved for PoseCare's built-in updater and is
          not the end-user installation package.
          "@ | Set-Content -LiteralPath "release-notes.md" -Encoding utf8NoBOM

          gh release create $env:RELEASE_TAG `
              "release\PoseCare-update-windows-x64.zip" `
              "release\PoseCare-update-windows-x64.zip.sha256" `
              "release\PoseCareSetup-windows-x64.exe" `
              "release\PoseCareSetup-windows-x64.exe.sha256" `
              "release\release.json" `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:RELEASE_COMMIT `
              --title "PoseCare $env:RELEASE_TAG" `
              --notes-file "release-notes.md" `
              --latest=false
          if ($LASTEXITCODE -ne 0) {
              throw "Could not create GitHub Release $env:RELEASE_TAG."
          }

          # The concurrency queue is FIFO by wait time, not necessarily by build ID.
          # Reconcile Latest after every publish so an older run that waited later cannot
          # replace a newer semantic version/build. 200 covers the full 100-run
          # concurrency queue plus existing/manual releases.
          $publishedReleases = @(gh release list `
              --repo $env:GITHUB_REPOSITORY `
              --limit 200 `
              --json tagName | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) {
              throw "Could not list GitHub Releases."
          }

          $buildReleases = foreach ($release in $publishedReleases) {
              if ($release.tagName -match '^v(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)-build\.(?<build>\d+)\.(?<attempt>\d+)$') {
                  [pscustomobject]@{
                      Tag = $release.tagName
                      Major = [long]$Matches.major
                      Minor = [long]$Matches.minor
                      Patch = [long]$Matches.patch
                      Build = [long]$Matches.build
                      Attempt = [long]$Matches.attempt
                  }
              }
          }
          $latestBuild = $buildReleases |
              Sort-Object -Property `
                  @{ Expression = { $_.Major }; Descending = $true }, `
                  @{ Expression = { $_.Minor }; Descending = $true }, `
                  @{ Expression = { $_.Patch }; Descending = $true }, `
                  @{ Expression = { $_.Build }; Descending = $true }, `
                  @{ Expression = { $_.Attempt }; Descending = $true } |
              Select-Object -First 1
          if (-not $latestBuild) {
              throw "No PoseCare build Release was found after publishing $env:RELEASE_TAG."
          }

          gh release edit $latestBuild.Tag --repo $env:GITHUB_REPOSITORY --latest
          if ($LASTEXITCODE -ne 0) {
              throw "Could not mark $($latestBuild.Tag) as the Latest Release."
          }
